services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single Postgres instance, two logical databases (feast_registry created
  # by POSTGRES_DB below, mlflow created by scripts/postgres_init/'s init
  # script) - Feast's registry and MLflow's tracking store are unrelated
  # schemas, no reason to run two separate Postgres containers for them.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spam_detection
      POSTGRES_PASSWORD: spam_detection
      POSTGRES_DB: feast_registry
    ports:
      # Host-side 5433, not 5432: this machine already runs a native
      # Postgres on 5432, and both listeners cause connections to land on
      # the wrong server (intermittent password-auth failures).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spam_detection -d feast_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
